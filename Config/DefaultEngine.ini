[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
; Virtual shadow maps + Substrate + Lumen were stacking shader/PSO pressure on cold DDC.
; Keep the sandbox on a lighter deferred path until the editor stays up.
r.Shadow.Virtual.Enable=0

r.GenerateMeshDistanceFields=True

; 0=None (was Lumen). Re-enable after DDC warms and PIE is stable.
r.DynamicGlobalIlluminationMethod=0

; 0=None (was Lumen). Screen-space is fine for the flight sandbox.
r.ReflectionMethod=0

r.SkinCache.CompileShaders=True

; Path-tracing RTPSO creation was OOMing at editor startup on this machine
; (D3D12 8007000e -> "Shader compilation failures are Fatal"). Keep RT off for the sandbox.
r.RayTracing=False

r.RayTracing.RayTracingProxies.ProjectEnabled=False

r.PathTracing=0

r.Substrate=False

r.Substrate.ProjectGBufferFormat=0

r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True

r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8

r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

; Cap streaming so 4K station maps don't fight PSO creation for VRAM.
r.Streaming.PoolSize=700
r.Streaming.LimitPoolSizeToVRAM=1

; Avoid TSR PSO creation during fragile cold starts (breadcrumbs showed TemporalSuperResolution).
r.AntiAliasingMethod=0
r.DefaultFeature.AntiAliasing=0

