; Stabilize cold-start on memory-constrained hosts (D3D12 8007000e during PSO create).
r.RHICmdBufferWriteLocks=0
r.ShaderCompiler.JobCache=1
r.ShaderCompiler.PerShaderDDCCleanup=0
; Leave headroom for the editor UI + texture encodes on 48GB systems with low free RAM.
r.NumUnusedShaderCompilingThreads=10
r.XGEShaderCompile=0
